# Services that consume different review children share only execute-only
# traversal on this parent. Each child keeps its own narrower reader group.
d /var/lib/dek-review 0710 dek-review dek-review-traverse -
d /var/lib/dek-review/input 2750 dek-source-ingest dek-review-input -
# IsolatedReviewClone prunes whole snapshot clones itself.  tmpfiles age-cleaning
# this directory can remove an idle clone's .git metadata while leaving its
# recently-read working tree behind, turning a readable review page into a 500
# when the reviewer submits a decision.
d /var/lib/dek-review/clones 0700 dek-review dek-review -
d /var/lib/dek-review/decisions 2750 dek-review dek-decision-read -
d /var/lib/dek-review/state 0700 dek-review dek-review -
d /var/lib/dek-review/secrets 0700 dek-review dek-review -
d /var/lib/dek-review/bundle-archive 2750 dek-review dek-bundle-read -
d /var/lib/dek-publisher 0700 dek-publisher dek-publisher -
d /var/lib/dek-publisher/state 0700 dek-publisher dek-publisher -
d /var/lib/dek-publisher/clones 0700 dek-publisher dek-publisher 1d
d /var/lib/dek-publisher/secrets 0700 dek-publisher dek-publisher -
d /var/empty/dek-publisher 0755 root root -
d /var/empty/dek-builder 0755 root root -
d /var/empty/dek-activator 0755 root root -
d /var/empty/dek-source-ingest 0755 root root -
d /var/empty/dek-review 0755 root root -
d /var/lib/dek-source-ingest 0750 dek-source-ingest dek-source-ingest -
d /var/lib/dek-source-ingest/clones 0700 dek-source-ingest dek-source-ingest 1d
d /var/lib/dek-source-ingest/proofs 0700 dek-source-ingest dek-source-ingest -
d /var/spool/dek-build 0711 root root -
d /var/spool/dek-build/approved 2750 dek-publisher dek-approved-read 7d
d /var/lib/dek-builder 0700 dek-builder dek-builder -
d /var/lib/dek-builder/private 0700 dek-builder dek-builder 1d
d /var/lib/dek-web 0700 dek-web dek-web -
d /var/lib/dek-web/secrets 0700 dek-web dek-web -
d /var/lib/dek-qa 0710 dek-qa dek-qa-venv-read -
d /var/lib/dek-qa/secrets 0700 dek-qa dek-qa -
d /var/lib/dek-activator 0700 dek-activator dek-activator -
d /var/lib/dek-activator/secrets 0700 dek-activator dek-activator -
d /var/spool/dek-activate 0711 root root -
d /var/spool/dek-activate/builds 2775 dek-builder dek-build-write 7d
# Read consumers need execute-only traversal to the group-readable control and
# releases children; they still cannot list this root or enter private siblings.
d /var/lib/dek-activate 0710 dek-activator dek-release-read -
d /var/lib/dek-activate/control 2750 dek-activator dek-release-read -
d /var/lib/dek-activate/releases 2750 dek-activator dek-release-read -
d /var/lib/dek-activate/journal 0700 dek-activator dek-activator -
d /var/lib/dek-activate/spent 0700 dek-activator dek-activator -
d /var/lib/dek-activate/outcomes 2750 dek-activator dek-outcome-read -
d /run/dek-proofs 0751 dek-activator dek-proof-read -
d /run/dek-proofs/qa 2750 dek-qa dek-proof-read -
d /var/lib/dek-git-auth 0700 root root -
d /var/lib/dek-readiness 0700 root root -
