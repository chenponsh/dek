upstream dek_review {
    server unix:/run/dek-review/dek-review.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name review.regkb.chenponai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        if ($request_method != GET) { return 405; }
        return 302 https://regkb.chenponai.com/review/;
    }

    location / {
        return 404;
    }
}

# Legacy hostname: keep only the remembered homepage as a safe entry point.
# Do not redirect callbacks or POSTs across origins; all non-root paths fail
# closed after the coordinated OAuth callback migration to the main origin.
server {
    listen 443 ssl;
    server_name review.regkb.chenponai.com;
    ssl_certificate /etc/letsencrypt/live/review.regkb.chenponai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.regkb.chenponai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        if ($request_method != GET) { return 405; }
        return 302 https://regkb.chenponai.com/review/;
    }

    location / {
        return 404;
    }
}
