# Include inside the TLS server for regkb.chenponai.com.
# The trailing slash on proxy_pass deliberately strips /review/ before the
# request reaches ReviewApp; generated links and cookies remain /review scoped.
location = /review {
    if ($request_method != GET) { return 405; }
    return 302 /review/;
}

location ^~ /review/ {
    client_max_body_size 1m;
    proxy_pass http://dek_review/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix /review;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;
    proxy_hide_header Server;
}
